name: Native transport diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 工具链版本
        run: swift --version
      - name: 原生转发诊断
        env:
          HGHUB_TRANSPORT_TRACE: '1'
        run: python3 tests/test_prefip_transport.py -v
